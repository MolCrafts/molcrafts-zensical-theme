name: test

# Every commit-stage hook in .pre-commit-config.yaml on every file, the
# workflows against the CI scheme, and the suite against the built wheel, so
# package-data is tested as shipped. Two tiers (`test / context` decides):
#
#   fast  a feature-branch push to MolCrafts: Python 3.12.
#   full  every push to a fork (proven before its pull request), dev and
#         master on MolCrafts, pull requests, tags and dispatches:
#         Python 3.12, 3.13 and 3.14.
#
# release.yml runs this file through workflow_call before it builds.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# One group per file, workflow, event and ref. Under workflow_call (release.yml
# running the tests) github.workflow and github.event_name are the caller's, so
# a called run never shares, and so never cancels, a direct run's group.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Where this run happens, decided once: MolCrafts/molcrafts-ci context.yml.
  context:
    permissions:
      contents: read
    name: test
    uses: MolCrafts/molcrafts-ci/.github/workflows/context.yml@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76

  hooks:
    name: test / hooks
    needs: context
    # A pull request inside a fork was already run by its push.
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  python:
    name: test / python (${{ matrix.python }})
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.context.outputs.tier == 'full' && '["3.12","3.13","3.14"]' || '["3.12"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76
        with:
          python-version: ${{ matrix.python }}
      - run: uv build --wheel
      - run: uv run --isolated --no-project --python ${{ matrix.python }} --with dist/*.whl --with pytest pytest -q

  # The workflows against the CI scheme: MolCrafts/molcrafts-ci/actions/check-workflows.
  workflow-policy:
    name: test / workflows
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/check-workflows@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76

  result:
    name: test / result
    needs: [context, hooks, python, workflow-policy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; . == "success" or . == "skipped")'
