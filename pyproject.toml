[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molcrafts-zensical-theme"
version = "0.3.0"
description = "MolCrafts theme extension for Zensical documentation sites."
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
authors = [
  { name = "MolCrafts" }
]
keywords = ["molcrafts", "zensical", "documentation", "theme"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Documentation",
  "Topic :: Software Development :: Documentation",
]
dependencies = [
  "mkdocstrings>=1.0.0",
  "zensical>=0.0.45",
  # MolPlot fence bodies are usually YAML; JSON-only authoring works without it.
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/MolCrafts/molcrafts-zensical-theme"
Repository = "https://github.com/MolCrafts/molcrafts-zensical-theme"
Issues = "https://github.com/MolCrafts/molcrafts-zensical-theme/issues"

# The theme directory is `molcrafts_zensical_theme/templates`, not the package
# root: Zensical copies every non-template file from the theme directory into the
# built site, so package code must stay outside it (same layout as
# `material.templates`).
[project.entry-points."mkdocs.themes"]
molcrafts = "molcrafts_zensical_theme.templates"

[project.optional-dependencies]
dev = [
  "tox>=4.23",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["mkdocstrings_handlers.cpp*", "molcrafts_zensical_theme*"]
namespaces = true

[tool.setuptools.package-data]
"molcrafts_zensical_theme.templates" = [
  "mkdocs_theme.yml",
  "main.html",
  "partials/*.html",
  "assets/images/*.svg",
  "assets/stylesheets/*.css",
  "assets/javascripts/*.js",
]
"mkdocstrings_handlers.cpp" = [
  "py.typed",
  "templates/**/*.jinja",
  "templates/**/*.css",
]

[tool.tox]
requires = ["tox>=4.23"]
env_list = ["py"]

[tool.tox.env.py]
description = "install wheel + pytest"
package = "wheel"
base_python = ["python3.12"]
deps = ["pytest"]
commands = [
  ["{envpython}", "-m", "pytest", "-q"],
]
